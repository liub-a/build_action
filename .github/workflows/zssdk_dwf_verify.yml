name: build-zssdk-dwf-verify

# DWF 验证 workflow：只验 DWF native 构建与 Go 绑定，不产出、不上传任何产物。
#
# 源码在私有仓库 (https://code.zsrhkj.com/zsrhkj/zssdk.git)，CI 内用 token clone。
#
# 约束（产品仓库 docs/dwf/CI.md 同步记录）：
#   - DWF 不对外共享，本 workflow 不公开上传产物；因此没有任何 upload-artifact 步骤。
#   - 与 build-zssdk 无依赖关系，失败不阻塞 PDF release；只在本仓库手动 dispatch
#     的 Actions 运行页可见（产品仓库 PR 不会触发）。
#   - Linux 基线沿用 debian:bullseye（glibc 2.31），与 build-c-shared.sh 一致。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "产品仓库分支/标签 (默认 main)"
        required: false
        default: main

env:
  REPO_PATH: code.zsrhkj.com/zsrhkj/zssdk.git
  SRC_DIR: src
  # 与 go.mod 的 go 指令一致
  GO_VERSION: 1.26.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dwf-verify:
    name: dwf-verify (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product source
        shell: bash
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          ref="${REF:-main}"
          git -c credential.helper= \
              -c credential.helper='!f() { echo "username=$REPO_USER"; echo "password=$REPO_TOKEN"; }; f' \
              clone --depth 1 -b "$ref" \
              "https://${REPO_PATH}" "$SRC_DIR"
          echo "cloned ref=$ref"

      - name: Build DWF native + run tests (Linux container)
        shell: bash
        env:
          GO_VERSION: ${{ env.GO_VERSION }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -e GO_VERSION \
            -v "$PWD/${SRC_DIR}:/src" -w /src \
            debian:bullseye bash -c '
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # bullseye 已进入 archive.debian.org，官方镜像的 security 池会 404，
          # 因此先把源指到 archive 并关掉 Valid-Until 检查（EOL 发行版必需）。
          sed -i "s|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|" /etc/apt/sources.list
          sed -i "s|http://deb.debian.org/debian|http://archive.debian.org/debian|" /etc/apt/sources.list
          sed -i "/bullseye-updates/d" /etc/apt/sources.list
          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archive
          apt-get update
          # debian:bullseye 自带 cmake 3.18，而 dwf/native/CMakeLists.txt 要求 3.20+，
          # 所以用 pip 装一个较新的 cmake（wheel 自带二进制，不动 glibc 基线）。
          # pkg-config 不能省：build-dwf-native.sh 末尾会自检 zs-dwf-native.pc，
          # 且 cgo 链接依赖 PKG_CONFIG_PATH；build-essential 不带它。
          apt-get install -y --no-install-recommends \
            build-essential perl git ca-certificates curl python3-pip pkg-config
          rm -rf /var/lib/apt/lists/*
          python3 -m pip install --no-cache-dir cmake
          export PATH="/usr/local/bin:${PATH}"
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -xz -C /usr/local
          export PATH="/usr/local/go/bin:${PATH}"
          export GOCACHE=/tmp/gocache GOPATH=/tmp/gopath
          cmake --version | head -1
          bash scripts/build-dwf-native.sh --rid linux-amd64 --tests
          source build/dwf/linux-amd64/env.sh
          go test -tags dwf ./dwf/...
          '

  # --with-dwf 的 c-shared 产物是真正出货的形态（LIB 静态链进 libzs.so），
  # 这条平台相关逻辑（--exclude-libs,ALL + version script）此前只在 darwin 验证过。
  # 脚本自带四项硬验收：动态导出面与 PDF-only 基线逐行一致、无 zs_dwf_*/zs_w2d_*
  # 动态导出、zs_dwf_get_info_json 以局部符号存在、不 strip。job 再补 rpath、
  # DT_NEEDED、运行时冒烟与拒绝分支断言；不上传任何产物。
  #
  # 矩阵：amd64 用 ubuntu-latest、arm64 用 ubuntu-24.04-arm（原生 arm runner，
  # 容器走 --platform linux/arm64，避免在 amd64 上跑 qemu 交叉构建）。
  dwf-cshared:
    name: dwf-cshared (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            goarch: amd64
            pdfium: linux-x64
            arch: x64
            lib: dist/libzs-linux-x64.so
            hdr: dist/libzs-linux-x64.h
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            goarch: arm64
            pdfium: linux-arm64
            arch: arm64
            lib: dist/libzs-linux-arm64.so
            hdr: dist/libzs-linux-arm64.h
    steps:
      - name: Checkout product source
        shell: bash
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          ref="${REF:-main}"
          git -c credential.helper= \
              -c credential.helper='!f() { echo "username=$REPO_USER"; echo "password=$REPO_TOKEN"; }; f' \
              clone --depth 1 -b "$ref" \
              "https://${REPO_PATH}" "$SRC_DIR"
          echo "cloned ref=$ref"

      - name: Build c-shared with DWF + verify exports (Linux container)
        shell: bash
        env:
          GO_VERSION: ${{ env.GO_VERSION }}
          GOARCH: ${{ matrix.goarch }}
          PLATFORM: ${{ matrix.platform }}
          PDFIUM: ${{ matrix.pdfium }}
          ARCH: ${{ matrix.arch }}
          LIB: ${{ matrix.lib }}
          HDR: ${{ matrix.hdr }}
        run: |
          set -euo pipefail
          docker run --rm --platform "$PLATFORM" \
            -e GO_VERSION -e GOARCH -e PDFIUM -e ARCH -e LIB -e HDR \
            -v "$PWD/${SRC_DIR}:/src" -w /src \
            debian:bullseye bash -c '
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sed -i "s|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|" /etc/apt/sources.list
          sed -i "s|http://deb.debian.org/debian|http://archive.debian.org/debian|" /etc/apt/sources.list
          sed -i "/bullseye-updates/d" /etc/apt/sources.list
          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential perl git ca-certificates curl python3-pip pkg-config
          rm -rf /var/lib/apt/lists/*
          python3 -m pip install --no-cache-dir cmake
          export PATH="/usr/local/bin:${PATH}"
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GOARCH}.tar.gz" | tar -xz -C /usr/local
          export PATH="/usr/local/go/bin:${PATH}"
          export GOCACHE=/tmp/gocache GOPATH=/tmp/gopath
          echo "=== ${GOARCH} / ${PDFIUM} / ${ARCH} ==="
          uname -m
          # PDF-only 基线构建需要 pdfium 的 .pc 与 libpdfium.so。
          PDFIUM_TARGET="${PDFIUM}" bash scripts/fetch-pdfium.sh
          # 脚本内部完成：DWF native 静态构建 → PDF-only 基线 → --with-dwf 链接 →
          # 四项符号硬验收（导出面逐行一致 / 无 DWF 动态导出 / 局部符号 / 不 strip）。
          bash scripts/build-c-shared.sh --with-dwf --arch "${ARCH}"
          test -f "$LIB"
          ls -l "$LIB" "$HDR"
          # 相对 rpath：宿主把 libpdfium 放在同一目录即可加载。
          readelf -d "$LIB" > /tmp/dyn.txt
          grep -q "ORIGIN" /tmp/dyn.txt || { echo "FAIL: 缺少 \$ORIGIN rpath"; exit 1; }
          echo "=== DT_NEEDED ==="
          grep NEEDED /tmp/dyn.txt
          # 不得动态依赖任何 DWF 共享库（DWF 是静态链进去的）。
          if grep NEEDED /tmp/dyn.txt | grep -qi "dwf"; then
            echo "FAIL: DT_NEEDED 出现 DWF 共享库"; exit 1
          fi
          # 动态导出面计数，作为日志留证（与 PDF-only 基线的一致性由脚本断言）。
          nm -D --defined-only "$LIB" > /tmp/dynsym.txt
          echo "dynamic defined symbols: $(wc -l < /tmp/dynsym.txt)"
          echo "zs_* exports: $(grep -c " zs_" /tmp/dynsym.txt || true)"
          echo "zs_dwf_* / zs_w2d_* exports: $(grep -c "zs_dwf_\|zs_w2d_" /tmp/dynsym.txt || true)"
          # 运行时冒烟：只验「能 dlopen + 能调用免授权 ABI」，不打开任何文档。
          # sdk_release 产物打开文档需要授权文件，容器里没有；这里能证明的是加载期
          # 全部符号可解析（ctypes 的 dlopen 带 RTLD_NOW）、Go 运行时正常初始化。
          python3 -c "import ctypes, sys; lib = ctypes.CDLL(sys.argv[1], mode=ctypes.RTLD_GLOBAL); lib.zs_version.restype = ctypes.c_char_p; v = lib.zs_version(); print(v); assert v; lib.zs_machine_id.restype = ctypes.c_char_p; print(lib.zs_machine_id()); print(lib.zs_license_installed())" "$PWD/$LIB"
          # 拒绝分支：--with-dwf 只支持 amd64/arm64，386 与 mips64le 必须快速失败。
          for a in 386 mips64le; do
            if bash scripts/build-c-shared.sh --with-dwf --arch "$a" >/tmp/neg.log 2>&1; then
              echo "FAIL: --with-dwf --arch $a 应被拒绝"; exit 1
            fi
            grep -q "不支持 linux/$a" /tmp/neg.log ||
              { echo "FAIL: linux/$a 的错误信息不符"; cat /tmp/neg.log; exit 1; }
            echo "reject ok: linux/$a"
          done
          '
