name: build-invoice_renamer

# 聚合构建仓库的 invoice_renamer workflow。
# 源码在私有仓库 (https://code.zsrhkj.com/zsrhkj/InvoiceRenamer.git)，CI 内用 token clone，
# 然后跑产品自带的构建脚本，最后产出 artifact。
# 构建逻辑不在本仓库，全部留在产品仓库 scripts/ 里。
#
# 技术栈比 pdf_reader 复杂：Tauri 外壳（Rust + 系统 WebView）+ C# 后台（.NET 8 自包含）+ 静态前端。
#   Linux：ubuntu runner 自带 WebKitGTK 4.1，补 apt 依赖即可。
#   Windows：跑产品自带的 WiX 品牌安装包脚本（.bat），另需 WiX 5.0.2 + .NET Framework 4.8。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "产品仓库分支/标签 (默认 master)"
        required: false
        default: master
      platforms:
        description: "构建平台 (all / win / linux)"
        required: false
        default: all
        type: choice
        options: [all, win, linux]
      release:
        description: "是否附到 GitHub Release"
        required: false
        default: false
        type: boolean

# 仅 release 时需要写权限
permissions:
  contents: write

env:
  REPO_PATH: code.zsrhkj.com/zsrhkj/InvoiceRenamer.git
  SRC_DIR: src
  # 让 Node20 的 action 提前跑在 Node24（与 pdf_reader 保持一致）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 暂不发布，若要出 mac 包再加 macos-latest + scripts/release-mac.sh
          - label: linux
            os: ubuntu-latest
            rid: linux-x64
          - label: win
            os: windows-latest
            rid: win-x64

    steps:
      # 平台过滤：platforms != all 且 != 当前 label 时跳过整个 job 的后续步骤
      - name: Resolve run flag
        id: flag
        shell: bash
        run: |
          want='${{ github.event.inputs.platforms }}'
          [ -z "$want" ] && want=all
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.label }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip ${{ matrix.label }} (selected: $want)"
          fi

      # Checkout 私有产品源码。
      # 用 git credential helper 把 token 写入内存，避免内嵌进 remote URL（不进进程列表/日志）。
      - name: Checkout product source
        if: steps.flag.outputs.run == 'true'
        shell: bash
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          ref="${REF:-master}"
          git -c credential.helper= \
              -c credential.helper='!f() { echo "username=$REPO_USER"; echo "password=$REPO_TOKEN"; }; f' \
              clone --depth 1 -b "$ref" \
              "https://${REPO_PATH}" "$SRC_DIR"
          echo "cloned ref=$ref"

      - name: Setup .NET 8
        if: steps.flag.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # npx @tauri-apps/cli@2（打包外壳）和 scripts/windows/release-tool.mjs（版本号/元数据）都要 node
      - name: Setup Node
        if: steps.flag.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        if: steps.flag.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -V && cargo -V

      # Tauri 外壳链接系统 WebKitGTK，ubuntu-latest（24.04）有 4.1，装开发包即可。
      # rpm 提供 rpmbuild，缺了产品脚本会自己跳过 rpm 包。
      - name: Install Linux build deps
        if: steps.flag.outputs.run == 'true' && matrix.label == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev \
            build-essential curl file patchelf rpm

      # 品牌安装包用 WiX 5.0.2（Burn bundle + MSI）。必须是 5.x：产品脚本会检查大版本，
      # 6/7 直接报错。Bal/Util 扩展由产品脚本自己装到 artifacts/wix 下，这里不用 -g 装。
      - name: Install WiX 5.0.2
        if: steps.flag.outputs.run == 'true' && matrix.label == 'win'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2 || true
          export PATH="$PATH:$USERPROFILE/.dotnet/tools"
          wix --version

      - name: Build (linux)
        if: steps.flag.outputs.run == 'true' && matrix.label == 'linux'
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: bash scripts/build-linux.sh

      # 产品脚本自己会：发布后台 → tauri build --no-bundle → 下载 WebView2 引导程序 →
      # 构建安装界面(net48 WPF) → MSI → Burn 安装包。未配置签名即出未签名包。
      - name: Build (windows)
        if: steps.flag.outputs.run == 'true' && matrix.label == 'win'
        working-directory: ${{ env.SRC_DIR }}
        shell: cmd
        run: scripts\windows\build-installer.bat

      # OSS 上传 + hub.zsrhkj.com 版本注册改在本地做（与 pdf_reader 一致，CI 上传太慢）。
      # Action 只产出 artifact，本地 gh run download 后再跑产品的 scripts/upload-oss.sh。
      - name: Upload build artifacts
        if: steps.flag.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: invoice_renamer-${{ matrix.rid }}
          # 只收最终安装包，不收解包目录
          path: |
            ${{ env.SRC_DIR }}/src-tauri/target/release/bundle/deb/*.deb
            ${{ env.SRC_DIR }}/src-tauri/target/release/bundle/rpm/*.rpm
            ${{ env.SRC_DIR }}/src-tauri/target/release/bundle/tar/*.tar.gz
            ${{ env.SRC_DIR }}/artifacts/windows-installer/*/InvoiceRenamer-Setup-*.exe
            ${{ env.SRC_DIR }}/artifacts/windows-installer/*/SHA256SUMS.txt
            ${{ env.SRC_DIR }}/artifacts/windows-installer/*/installer-release.json
          if-no-files-found: error
          retention-days: 14

      # workflow_dispatch 无 tag，从 tauri.conf.json 取版本生成 tag
      - name: Resolve version
        id: ver
        if: >
          steps.flag.outputs.run == 'true' &&
          (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true')
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          v=$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "resolved version: $v"

      - name: Attach to GitHub Release
        if: >
          steps.flag.outputs.run == 'true' &&
          (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('invoice_renamer-v{0}', steps.ver.outputs.version) }}
          name: invoice_renamer ${{ steps.ver.outputs.version }}
          files: |
            ${{ env.SRC_DIR }}/src-tauri/target/release/bundle/deb/*.deb
            ${{ env.SRC_DIR }}/src-tauri/target/release/bundle/rpm/*.rpm
            ${{ env.SRC_DIR }}/src-tauri/target/release/bundle/tar/*.tar.gz
            ${{ env.SRC_DIR }}/artifacts/windows-installer/*/InvoiceRenamer-Setup-*.exe
          fail_on_unmatched_files: false
